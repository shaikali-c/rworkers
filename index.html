            /* ---------- Local storage helpers (name) ---------- */
            const NAME_KEY = "scale-user-name";
            const loadName = () => {

            /* ---------- IndexedDB ---------- */
            let _db = null;
            function openDB() {
                return new Promise((res, rej) => {
                    if (_db) return res(_db);
                    const req = indexedDB.open("atelier-capture", 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains("workers"))
                            db.createObjectStore("workers", {
                                keyPath: "id",
                                autoIncrement: true,
                            });
                    };
                    req.onsuccess = (e) => {
                        _db = e.target.result;
                        res(_db);
                    };
                    req.onerror = () => rej(req.error);
                });
            }
            async function idb(mode, fn) {
                const db = await openDB();
                return new Promise((res, rej) => {
                    const req = fn(
                        db.transaction("workers", mode).objectStore("workers"),
                    );
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }
            const idbAdd = (r) => idb("readwrite", (s) => s.add(r));
            const idbGetAll = () =>
                idb("readonly", (s) => s.getAll()).then((a) => a || []);
            const idbDelete = (id) => idb("readwrite", (s) => s.delete(id));
            const idbClear = () => idb("readwrite", (s) => s.clear());
            // Old records contain handPhoto and are incompatible with the new
            // worker-only capture format, so remove them once.
            async function idbPurgeLegacy() {
                const all = await idbGetAll();
                for (const w of all)
                    if (!w.photoNumber || w.handPhoto) await idbDelete(w.id);
            }
            // Patch a record only if it still exists (so a delete mid-upload isn't undone)
            async function idbUpdate(id, patch) {
                const db = await openDB();
                return new Promise((res, rej) => {
                    const tx = db.transaction("workers", "readwrite");
                    const st = tx.objectStore("workers");
                    const g = st.get(id);
                    g.onsuccess = () => {
                        if (g.result) st.put({ ...g.result, ...patch });
                    };
                    tx.oncomplete = () => res();
                    tx.onerror = () => rej(tx.error);
                });
            }

            /* ---------- Cloud upload (Supabase REST, no SDK) ---------- */
            const uuid = () =>
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
                          /[xy]/g,
                          (c) => {
                              const r = (Math.random() * 16) | 0;
                              return (c === "x" ? r : (r & 3) | 8).toString(16);
                          },
                      );
            const sbHeaders = (extra) =>
                Object.assign(
                    { apikey: SB_KEY },
                    SB_KEY.startsWith("eyJ")
                        ? { Authorization: "Bearer " + SB_KEY }
                        : {},
                    extra,
                );
            const isDuplicate = (status, text) =>
                status === 409 || /duplicate|already exists/i.test(text);

            async function sbUploadFile(path, blob) {
                const res = await fetch(
                    SB_URL + "/storage/v1/object/" + SB_BUCKET + "/" + path,
                    {
                        method: "POST",
                        headers: sbHeaders({ "Content-Type": "image/jpeg" }),
                        body: blob,
                    },
                );
                if (res.ok) return;
                const t = await res.text();
                if (!isDuplicate(res.status, t))
                    throw new Error("storage " + res.status + " " + t);
            }

            async function uploadWorker(w, userName) {
                const clientId = w.clientId || uuid();
                if (!w.clientId) await idbUpdate(w.id, { clientId });

                const photoPath = w.deviceId + "/photos/" + w.photoNumber + ".jpg";

                await sbUploadFile(photoPath, w.workerPhoto);

                const res = await fetch(SB_URL + "/rest/v1/workers", {
                    method: "POST",
                    headers: sbHeaders({
                        "Content-Type": "application/json",
                        Prefer: "return=minimal",
                    }),
                    body: JSON.stringify({
                        client_id: clientId,
                        device_id: w.deviceId,
                        photo_number: w.photoNumber,
                        user_name: userName || null,
                        worker_photo_path: photoPath,
                        worker_captured_at: w.workerCapturedAt,
                    }),
                });

                if (!res.ok) {
                    const t = await res.text();
                    if (!isDuplicate(res.status, t))
                        throw new Error("table " + res.status + " " + t);
                }

                await idbUpdate(w.id, {
                    synced: true,
                    syncedAt: new Date().toISOString(),
                });
            }

            // Remove these workers' photos + rows from Supabase.
            async function cloudDeleteWorkers(list) {
                let deleted = 0;
                for (let i = 0; i < list.length; i += 50) {
                    const chunk = list.slice(i, i + 50);
                    const prefixes = chunk.map(
                        (w) => w.deviceId + "/photos/" + w.photoNumber + ".jpg",
                    );

                    let res = await fetch(
                        SB_URL + "/storage/v1/object/" + SB_BUCKET,
                        {
                            method: "DELETE",
                            headers: sbHeaders({
                                "Content-Type": "application/json",
                            }),
                            body: JSON.stringify({ prefixes }),
                        },
                    );

                    if (!res.ok)
                        throw new Error(
                            "storage delete " +
                                res.status +
                                " " +
                                (await res.text()),
                        );

                    res = await fetch(
                        SB_URL +
                            "/rest/v1/workers?select=client_id&client_id=in.(" +
                            chunk.map((w) => w.clientId).join(",") +
                            ")",
                        {
                            method: "DELETE",
                            headers: sbHeaders({
                                Prefer: "return=representation",
                            }),
                        },
                    );

                    if (!res.ok)
                        throw new Error(
                            "table delete " +
                                res.status +
                                " " +
                                (await res.text()),
                        );

                    deleted += (await res.json()).length;
                }
                return deleted;
            }

            /* ---------- Fast capture ----------
   Why the old version was slow: after the first photo it called
   ImageCapture.takePhoto() (full-sensor still, 1–3s and it stalls the
   preview), then decoded + re-encoded that 12MP+ image, then ran a
   6-frame burst on full-res canvases with CPU readback. Now we only grab
   a few frames straight from the live video at ≤1600px — ~200–400 ms. */
            const MAX_DIM = 1600,
                QUALITY = 0.85,
                SCORE_W = 240,
                BURST = 3,
                GAP = 50;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            function sharpness(ctx, w, h) {
                const d = ctx.getImageData(0, 0, w, h).data;
                const g = new Float32Array(w * h);
                for (let i = 0, j = 0; i < d.length; i += 4, j++)
                    g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                let sum = 0,
                    sq = 0,
                    n = 0;
                for (let y = 1; y < h - 1; y++)
                    for (let x = 1; x < w - 1; x++) {
                        const i = y * w + x;
                        const l =
                            -4 * g[i] +
                            g[i - 1] +
                            g[i + 1] +
                            g[i - w] +
                            g[i + w];
                        sum += l;
                        sq += l * l;
                        n++;
                    }
                const m = sum / n;
                return sq / n - m * m;
            }

            async function captureFrame(video) {
                if (!video || video.readyState < 2 || !video.videoWidth)
                    return null;
                const vw = video.videoWidth,
                    vh = video.videoHeight;
                const s = Math.min(1, MAX_DIM / Math.max(vw, vh));
                const w = Math.round(vw * s),
                    h = Math.round(vh * s);
                const cur = document.createElement("canvas");
                cur.width = w;
                cur.height = h;
                const best = document.createElement("canvas");
                best.width = w;
                best.height = h;
                const small = document.createElement("canvas");
                small.width = SCORE_W;
                small.height = Math.round((SCORE_W * h) / w);
                const cctx = cur.getContext("2d"),
                    bctx = best.getContext("2d"),
                    sctx = small.getContext("2d", { willReadFrequently: true });
                let top = -1;
                for (let i = 0; i < BURST; i++) {
                    if (i) await sleep(GAP);
                    cctx.drawImage(video, 0, 0, w, h);
                    sctx.drawImage(cur, 0, 0, small.width, small.height);
                    const sc = sharpness(sctx, small.width, small.height);
                    if (sc > top) {
                        top = sc;
                        bctx.drawImage(cur, 0, 0);
                    }
                }
                return new Promise((res, rej) =>
                    best.toBlob(
                        (b) => (b ? res(b) : rej(new Error("encode failed"))),
                        "image/jpeg",
                        QUALITY,
                    ),
                );
            }

            async function tuneTrack(track) {
                try {
                    const caps = track.getCapabilities
                        ? track.getCapabilities()
                        : {};
                    const adv = [];
                    ["focusMode", "exposureMode", "whiteBalanceMode"].forEach(
                        (k) => {
                            if (caps[k] && caps[k].indexOf("continuous") !== -1)
                                adv.push({ [k]: "continuous" });
                        },
                    );
                    if (adv.length)
                        await track.applyConstraints({ advanced: adv });
                } catch (e) {}
            }

            function OtpInput({ value, onChange, error }) {

            /* ---------- Views ---------- */
            function NameView({ initial, onSave, onSkip }) {
                const [name, setName] = useState(initial || "");
                const submit = (e) => {
                    e.preventDefault();
                    if (name.trim()) onSave(name.trim());
                };
                return (
                    <div className="flex-1 overflow-y-auto px-[22px] pt-[30px] pb-[calc(env(safe-area-inset-bottom,0px)+30px)] animate-rise">

                            Welcome, <em className="italic text-muted">who's this?</em>
                        </h1>
                        <p className="text-muted text-[14px] leading-[1.55] mb-[30px] max-w-[34ch]">

                            added to exports.
                        </p>
                        <form onSubmit={submit} autoComplete="off">
                            <div className="mb-[22px] relative">
                                <label className="block text-[11px] uppercase tracking-[0.18em] text-muted mb-2.5 font-medium">
                                    Your name
                                </label>
                                <input
                                    className="w-full bg-s1 border border-line rounded-card p-[18px] text-[20px] text-ink outline-none font-serif focus:border-line2 focus:bg-s2 placeholder:text-faint placeholder:italic"
                                    autoFocus
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="e.g. Ravi Kumar"
                                    maxLength={60}
                                />
                            </div>
                            <button
                                type="submit"
                                className="w-full flex items-center justify-center gap-[9px] rounded-card font-semibold tracking-[0.06em] uppercase transition-transform duration-100 bg-accent text-[#111] p-[19px] text-[15px] disabled:opacity-35 active:scale-[0.98]"
                                disabled={!name.trim()}
                            >
                                Continue
                            </button>
                            {onSkip && (
                                <button
                                    type="button"
                                    className="w-full flex items-center justify-center gap-[9px] rounded-card font-semibold tracking-[0.06em] uppercase transition-transform duration-100 border border-line text-muted py-4 text-[13px] font-medium mt-3"
                                    onClick={onSkip}

                                    Cancel

                    </div>
                );

            function WorkerForm({ onSubmit }) {
                const [device, setDevice] = useState("");
                const [err, setErr] = useState("");
                const submit = (e) => {
                    e.preventDefault();
                    if (!/^\d{5}$/.test(device))
                        return setErr("Device ID must be exactly 5 digits");

                    onSubmit(device);

                return (
                    <div className="flex-1 overflow-y-auto px-[22px] pt-[30px] pb-[calc(env(safe-area-inset-bottom,0px)+30px)] animate-rise">

                            Worker <em className="italic text-muted">capture</em>
                        </h1>
                        <p className="text-muted text-[14px] leading-[1.55] mb-[30px] max-w-[34ch]">
                            Enter the device code for every 2 workers. Then capture two worker photos.
                        </p>
                        <form onSubmit={submit} autoComplete="off">
                            <OtpInput
                                value={device}
                                onChange={setDevice}
                                error={!!err}
                            />
                            <div className="text-[12px] text-danger mt-2 min-h-4">{err}</div>
                            <button
                            type="submit"
                            className="w-full flex items-center justify-center gap-[9px] rounded-card font-semibold tracking-[0.06em] uppercase transition-transform duration-100 bg-accent text-[#111] p-[19px] text-[15px] disabled:opacity-35 active:scale-[0.98]"
                        >
                                <IconCamera />
                                Open Camera
                            </button>
                        </form>
                    </div>
                );
            }

            function CameraView({ deviceId, startNumber, onComplete, onCancel, showToast }) {
                const [photoNumber, setPhotoNumber] = useState(startNumber);
                const [pairShot, setPairShot] = useState(0);
                const [camError, setCamError] = useState(null);
                const [flash, setFlash] = useState(false);
                const [ready, setReady] = useState(false);
                const [capturing, setCapturing] = useState(false);

                const videoRef = useRef(null);
                const streamRef = useRef(null);
                const busy = useRef(false);
                const pair = useRef([]);

                useEffect(() => {
                    let cancelled = false;

                    (async () => {
                        if (
                            !navigator.mediaDevices ||
                            !navigator.mediaDevices.getUserMedia
                        )
                            return setCamError(
                                "Camera not supported. Use a modern mobile browser over HTTPS or localhost.",
                            );

                        try {
                            const stream =
                                await navigator.mediaDevices.getUserMedia({
                                    audio: false,
                                    video: {
                                        facingMode: { ideal: "environment" },
                                        width: { ideal: 1920 },
                                        height: { ideal: 1080 },
                                    },
                                });

                            if (cancelled)
                                return stream
                                    .getTracks()
                                    .forEach((t) => t.stop());

                            streamRef.current = stream;
                            tuneTrack(stream.getVideoTracks()[0]);

                            const v = videoRef.current;
                            if (v) {
                                v.srcObject = stream;
                                try {
                                    await v.play();
                                } catch (e) {}
                            }
                        } catch (err) {
                            if (cancelled) return;
                            setCamError(
                                err.name === "NotAllowedError" ||
                                    err.name === "SecurityError"
                                    ? "Camera permission denied. Allow camera access in browser settings, then try again."
                                    : err.name === "NotFoundError"
                                      ? "No camera found on this device."
                                      : "Could not start camera: " + err.message,
                            );
                        }
                    })();

                    return () => {
                        cancelled = true;
                        if (streamRef.current)
                            streamRef.current
                                .getTracks()
                                .forEach((t) => t.stop());
                    };
                }, []);

                const tapFocus = async (e) => {
                    const track =
                        streamRef.current &&
                        streamRef.current.getVideoTracks()[0];

                    try {
                        if (!track || !track.getCapabilities().pointsOfInterest)
                            return;

                        const r = e.currentTarget.getBoundingClientRect();
                        const x = Math.min(
                            1,
                            Math.max(0, (e.clientX - r.left) / r.width),
                        );
                        const y = Math.min(
                            1,
                            Math.max(0, (e.clientY - r.top) / r.height),
                        );

                        await track.applyConstraints({
                            advanced: [
                                {
                                    pointsOfInterest: [{ x, y }],
                                    focusMode: "single-shot",
                                },
                            ],
                        });

                        setTimeout(
                            () =>
                                track
                                    .applyConstraints({
                                        advanced: [{ focusMode: "continuous" }],
                                    })
                                    .catch(() => {}),
                            1800,
                        );
                    } catch (err) {}
                };

                const capture = async () => {
                    if (busy.current || camError || !ready) return;

                    busy.current = true;
                    setCapturing(true);

                    const capturedAt = new Date().toISOString();

                    try {
                        setFlash(true);
                        setTimeout(() => setFlash(false), 260);

                        const blob = await captureFrame(videoRef.current);
                        if (!blob) throw new Error("no frame");

                        pair.current.push({
                            workerPhoto: blob,
                            workerCapturedAt: capturedAt,
                            photoNumber: photoNumber + pair.current.length,
                        });

                        if (pair.current.length === 2) {
                            const completedPair = pair.current;
                            pair.current = [];

                            await onComplete(completedPair);

                            setPhotoNumber((n) => n + 2);
                            setPairShot(0);
                            showToast(
                                "2 photos saved — ready for the next worker",
                            );
                        } else {
                            setPairShot(1);
                            showToast("First photo saved — take the second");
                        }
                    } catch (e) {
                        console.error(e);
                        showToast("Capture failed — please retry");
                    } finally {
                        busy.current = false;
                        setCapturing(false);
                    }
                };

                const hint = camError
                    ? ""
                    : capturing
                      ? "Hold still…"
                      : !ready
                        ? "Starting camera…"
                        : pairShot === 0
                          ? "Take photo 1 of 2"
                          : "Take photo 2 of 2";

                return (
                    <div className="flex-1 flex flex-col overflow-hidden animate-rise">
                        <div className="shrink-0 flex items-center justify-between px-5 pt-[calc(env(safe-area-inset-top,0px)+18px)] pb-3.5">
                            <button
                                className="text-muted text-[13px] uppercase tracking-[0.1em] font-medium py-2"
                                onClick={onCancel}
                            >
                                ‹ Done
                            </button>
                            <div className="text-[11px] uppercase tracking-[0.2em] text-faint font-medium">
                                Device {deviceId}
                            </div>
                        </div>

                        <div className="shrink-0 px-[22px] pt-1.5 pb-3.5">
                            <div className="font-serif text-[40px] leading-none">
                                Worker <em className="italic text-muted">capture</em>
                            </div>
                            <div className="text-muted text-[13px] mt-1.5">
                                Photos {photoNumber} & {photoNumber + 1}
                            </div>
                        </div>

                        <div
                            className="flex-1 min-h-0 relative mx-4 rounded-[18px] overflow-hidden bg-black border border-line"
                            onClick={tapFocus}
                        >
                            {camError ? (
                                <div className="flex items-center justify-center h-full text-faint text-[14px] text-center p-[30px] leading-[1.6]">
                                    {camError}
                                </div>
                            ) : (
                                <video
                                    ref={videoRef}
                                    className="w-full h-full object-cover block"
                                    playsInline
                                    muted
                                    autoPlay
                                    onCanPlay={() => setReady(true)}
                                />
                            )}

                            <div
                                className={
                                    "absolute inset-0 bg-white opacity-0 pointer-events-none z-[5] " +
                                    (flash ? "animate-flashA" : "")
                                }
                            />
                        </div>

                        <div className="shrink-0 flex gap-2 px-[22px] pt-4 pb-1">
                            {[0, 1].map((i) => (
                                <div
                                    key={i}
                                    className={
                                        "flex-1 h-[3px] rounded-[2px] " +
                                        (pairShot > i ? "bg-accent" : "bg-s3")
                                    }
                                />
                            ))}
                        </div>

                        <div className="shrink-0 min-h-[26px] text-center text-[12px] text-faint tracking-[0.08em] px-[22px] pt-2.5">
                            {hint}
                        </div>

                        <div className="shrink-0 flex justify-center px-[22px] pt-3 pb-[calc(env(safe-area-inset-bottom,0px)+22px)]">
                            <button
                                className="w-[78px] h-[78px] rounded-full border-[3px] border-accent flex items-center justify-center transition duration-100 active:scale-[0.92] disabled:opacity-35"
                                onClick={capture}
                                disabled={
                                    !!camError ||
                                    !ready ||
                                    capturing
                                }
                                aria-label="Capture worker photo"
                            >
                                <div className="w-[60px] h-[60px] rounded-full bg-accent" />
                            </button>
                        </div>
                    </div>
                );
            }

            const fmt = (iso) =>
                iso
                    ? new Date(iso).toLocaleString([], {
                          day: "numeric",
                          month: "short",
                          hour: "2-digit",
                          minute: "2-digit",
                      })
                    : "";

            function WorkerList({ workers, onDelete, cloudOn }) {
                const pending = workers.filter(
                    (w) => w.clientId && !w.synced,
                ).length;

                return (
                    <div className="flex-1 overflow-y-auto px-[22px] pt-[30px] pb-[110px] animate-rise">
                        <h2 className="font-serif text-[34px] font-normal">
                            Captured <em className="italic text-muted">workers</em>
                        </h2>

                        <div className="text-[12px] text-faint tracking-[0.1em] uppercase mt-1.5 mb-5">
                            {workers.length} photos
                            {cloudOn && pending
                                ? " · " + pending + " waiting to upload"
                                : ""}
                        </div>

                        {workers.length === 0 ? (
                            <div className="py-[60px] text-center text-faint text-[13px]">
                                <div className="font-serif italic text-[24px] text-muted mb-2">
                                    Nothing captured yet.
                                </div>
                                Start a worker capture to begin.
                            </div>
                        ) : (
                            workers.map((w) => (
                                <div
                                    className="flex items-center gap-3.5 py-[15px] px-1 border-b border-line"
                                    key={w.id}
                                >
                                    <div className="font-serif italic text-[20px] text-faint w-[30px] shrink-0">
                                        {String(w.photoNumber).padStart(2, "0")}
                                    </div>

                                    <div className="shrink-0">
                                        <Thumb blob={w.workerPhoto} />
                                    </div>

                                    <div className="flex-1 min-w-0">
                                        <div className="font-serif text-[21px] leading-[1.15]">
                                            ID {w.deviceId}
                                        </div>
                                        <div className="text-[12px] text-muted mt-[3px] tracking-[0.04em]">
                                            Photo {w.photoNumber} · {fmt(w.workerCapturedAt)}
                                            {cloudOn &&
                                                (w.synced ? (
                                                    <span className="inline-block ml-2 px-2 py-0.5 rounded-[20px] text-[10px] tracking-[0.1em] uppercase border text-[#7fd6a0] border-[rgba(127,214,160,0.35)]">
                                                        Synced
                                                    </span>
                                                ) : w.clientId ? (
                                                    <span className="inline-block ml-2 px-2 py-0.5 rounded-[20px] text-[10px] tracking-[0.1em] uppercase border text-[#e8c36a] border-[rgba(232,195,106,0.35)]">
                                                        Pending
                                                    </span>
                                                ) : (
                                                    <span className="inline-block ml-2 px-2 py-0.5 rounded-[20px] text-[10px] tracking-[0.1em] uppercase border border-line2 text-faint">
                                                        Local only
                                                    </span>
                                                ))}
                                        </div>
                                    </div>

                                    <button
                                        className="text-faint py-2.5 pl-2.5 pr-1 active:text-danger"
                                        onClick={() => onDelete(w)}
                                        aria-label="Delete photo"
                                    >
                                        <IconTrash size={16} />
                                    </button>
                                </div>
                            ))
                        )}
                    </div>
                );
            }

            /* ---------- App ---------- */
            function App() {
                const [userName, setUserName] = useState(loadName());
                const [screen, setScreen] = useState(
                    userName ? "list" : "name",
                );
                const [workers, setWorkers] = useState([]);
                const [pendingId, setPendingId] = useState(null);
                const [nextPhotoNumber, setNextPhotoNumber] = useState(1);
                const [toast, setToast] = useState("");
                const [exporting, setExporting] = useState(false);
                const [deleteTarget, setDeleteTarget] = useState(null);
                const [confirmAll, setConfirmAll] = useState(false);
                const [deletingAll, setDeletingAll] = useState(false);
                const [menuOpen, setMenuOpen] = useState(false);
                const timer = useRef(null);

                const showToast = useCallback((m) => {
                    setToast(m);
                    clearTimeout(timer.current);
                    timer.current = setTimeout(() => setToast(""), 2200);
                }, []);
                const refresh = useCallback(async () => {
                    const all = await idbGetAll();
                    setWorkers(all.sort((a, b) => a.id - b.id));
                }, []);
                const nameRef = useRef(userName);
                nameRef.current = userName;
                const syncing = useRef(false);
                const syncAll = useCallback(async (manual) => {
                    if (!CLOUD_ON) {
                        if (manual === true)
                            showToast("Add your Supabase URL and key first");
                        return;
                    }
                    if (syncing.current) return;
                    if (!navigator.onLine) {
                        if (manual === true)
                            showToast("You're offline — will upload later");
                        return;
                    }
                    syncing.current = true;
                    let ok = 0,
                        fail = 0;
                    try {
                        const all = await idbGetAll();
                        for (const w of all.filter(
                            (x) =>
                                x.clientId &&
                                x.workerPhoto &&
                                x.photoNumber &&
                                !x.synced,
                        )) {
                            try {
                                await uploadWorker(w, nameRef.current);
                                ok++;
                            } catch (e) {
                                console.error("Upload failed", e);
                                fail++;
                            }
                        }
                        await refresh();
                    } catch (e) {
                        console.error(e);
                    }
                    syncing.current = false;
                    if (fail)
                        showToast(
                            "Upload failed for " + fail + " — will retry",
                        );
                    else if (ok)
                        showToast(
                            "Uploaded " + ok + " worker" + (ok > 1 ? "s" : ""),
                        );
                    else if (manual === true)
                        showToast("Everything is already uploaded");
                }, []);

                useEffect(() => {
                    // No saved name = first run of this version -> wipe leftovers from the old version
                    (loadName()
                        ? Promise.resolve()
                        : idbPurgeLegacy().catch(() => {})
                    )
                        .then(refresh)
                        .then(
                            () => syncAll(),
                            () => showToast("Could not load saved workers"),
                        );
                    const on = () => syncAll();
                    window.addEventListener("online", on);
                    const t = setInterval(on, 60000); // retry failed uploads every minute
                    return () => {
                        window.removeEventListener("online", on);
                        clearInterval(t);
                    };
                }, []);

                const getNextPhotoNumber = useCallback(async (deviceId) => {
                    const all = await idbGetAll();
                    const nums = all
                        .filter((w) => w.deviceId === deviceId && w.photoNumber)
                        .map((w) => Number(w.photoNumber))
                        .filter(Number.isFinite);

                    return nums.length ? Math.max(...nums) + 1 : 1;
                }, []);

                const handleComplete = async (photos) => {
                    for (const photo of photos) {
                        await idbAdd({
                            deviceId: pendingId,
                            clientId: uuid(),
                            photoNumber: photo.photoNumber,
                            synced: false,
                            workerPhoto: photo.workerPhoto,
                            workerCapturedAt: photo.workerCapturedAt,
                        });
                    }

                    const next = Math.max(
                        ...photos.map((p) => Number(p.photoNumber)),
                    ) + 1;

                    setNextPhotoNumber(next);
                    await refresh();
                    syncAll();

                    // After every pair, require a new device code before
                    // capturing the next pair.
                    setPendingId(null);
                    setScreen("form");
                    showToast("2 workers saved. Enter the device code for the next 2 workers.");
                };

                const confirmDelete = async () => {
                    try {
                        await idbDelete(deleteTarget.id);
                        await refresh();
                        showToast("Worker deleted");
                    } catch {
                        showToast("Delete failed");
                    }
                    setDeleteTarget(null);
                };
                const deleteAll = async () => {
                    if (deletingAll) return;
                    setDeletingAll(true);
                    try {
                        let msg = "All workers deleted";
                        if (CLOUD_ON) {
                            const uploaded = (await idbGetAll()).filter(
                                (w) => w.clientId && w.synced,
                            );
                            if (uploaded.length) {
                                if (!navigator.onLine)
                                    throw new Error("offline");
                                const n = await cloudDeleteWorkers(uploaded);
                                if (n < uploaded.length)
                                    msg =
                                        "Deleted — " +
                                        (uploaded.length - n) +
                                        " not removed from cloud (already gone or delete policy missing)";
                            }
                        }
                        await idbClear();
                        await refresh();
                        showToast(msg);
                    } catch (e) {
                        console.error(e);
                        showToast(
                            "Couldn't delete from cloud — nothing was removed",
                        );
                    }
                    setDeletingAll(false);
                    setConfirmAll(false);
                };

                const handleExport = async () => {
                    if (exporting) return;

                    const complete = workers.filter(
                        (w) => w.workerPhoto && w.photoNumber,
                    );

                    if (!complete.length)
                        return showToast("No photos to export");

                    setExporting(true);

                    try {
                        const zip = new JSZip();

                        const devices = {};
                        for (const w of complete) {
                            if (!devices[w.deviceId])
                                devices[w.deviceId] = [];
                            devices[w.deviceId].push(w);
                        }

                        const manifest = [];

                        for (const [deviceId, photos] of Object.entries(devices)) {
                            const folder = zip.folder(deviceId).folder("photos");

                            for (const w of photos) {
                                folder.file(
                                    w.photoNumber + ".jpg",
                                    w.workerPhoto,
                                );

                                manifest.push({
                                    deviceID: deviceId,
                                    photoNumber: w.photoNumber,
                                    photo: deviceId + "/photos/" + w.photoNumber + ".jpg",
                                    capturedAt: w.workerCapturedAt,
                                });
                            }
                        }

                        zip.file(
                            "workers.json",
                            JSON.stringify(
                                { name: userName, photos: manifest },
                                null,
                                2,
                            ),
                        );

                        const blob = await zip.generateAsync({
                            type: "blob",
                            compression: "DEFLATE",
                            compressionOptions: { level: 6 },
                        });

                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download =
                            "workers-" +
                            new Date().toISOString().slice(0, 10) +
                            ".zip";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 5000);

                        showToast(
                            "ZIP downloaded — " +
                                complete.length +
                                " photos",
                        );
                    } catch (e) {
                        showToast("Export failed: " + e.message);
                    }

                    setExporting(false);
                };

                const hasName = !!userName;

                return (
                    <div className="h-full flex flex-col max-w-[520px] mx-auto relative sm:border-x sm:border-line">
                        <div className="shrink-0 flex items-center justify-between border-b border-line px-[22px] pb-[18px] pt-[calc(env(safe-area-inset-top,0px)+22px)]">
                            <div className="font-serif text-[30px] leading-none">
                                Scale{
                                    hasName && (
                                        <small className="block font-sans text-[11px] uppercase tracking-[0.14em] text-faint mt-1.5">
                                            {userName}
                                        </small>
                                    )
                                }
                            </div>
                            {hasName && (
                                <div className="flex items-center gap-2.5 relative">
                                    <button
                                        className="border border-line rounded-[30px] py-2.5 px-4 text-[11px] uppercase tracking-[0.12em] text-muted font-medium leading-none"
                                        onClick={() => setScreen("list")}
                                    >
                                        <b className="text-accent">{workers.length}</b> captured
                                    </button>
                                    {screen === "list" && (
                                        <>
                                            <button
                                                className="w-[38px] h-[38px] border border-line rounded-full flex items-center justify-center text-muted"
                                                onClick={() =>
                                                    setMenuOpen((o) => !o)
                                                }
                                                aria-label="Options"
                                            >
                                                <svg
                                                    width="16"
                                                    height="16"
                                                    viewBox="0 0 16 16"
                                                    fill="currentColor"
                                                >
                                                    <circle
                                                        cx="2.5"
                                                        cy="8"
                                                        r="1.6"
                                                    />
                                                    <circle
                                                        cx="8"
                                                        cy="8"
                                                        r="1.6"
                                                    />
                                                    <circle
                                                        cx="13.5"
                                                        cy="8"
                                                        r="1.6"
                                                    />
                                                </svg>
                                            </button>
                                            {menuOpen && (
                                                <div className="absolute top-[46px] right-0 bg-s2 border border-line2 rounded-[14px] min-w-[190px] z-[60] overflow-hidden">
                                                        <button
                                                            className="flex items-center gap-2.5 w-full py-[15px] px-[18px] text-[13px] uppercase tracking-[0.06em] font-medium active:bg-s3 disabled:opacity-40"
                                                            onClick={() => {
                                                                setMenuOpen(false);
                                                                handleExport();
                                                        }}
                                                        disabled={
                                                            exporting ||
                                                            !workers.length
                                                        }
                                                    >
                                                        {exporting ? (
                                                            "Building ZIP…"
                                                        ) : (
                                                            <>
                                                                <IconDownload />
                                                                Export ZIP
                                                            </>
                                                        )}
                                                    </button>
                                                    {CLOUD_ON && (
                                                        <button
                                                            className="flex items-center gap-2.5 w-full py-[15px] px-[18px] text-[13px] uppercase tracking-[0.06em] font-medium active:bg-s3 disabled:opacity-40"
                                                            onClick={() => {
                                                                setMenuOpen(
                                                                    false,
                                                                );
                                                                syncAll(true);
                                                            }}
                                                        >
                                                            <IconSync />
                                                            Sync now
                                                        </button>
                                                    )}
                                                    <button
                                                        className="flex items-center gap-2.5 w-full py-[15px] px-[18px] text-[13px] uppercase tracking-[0.06em] font-medium active:bg-s3 disabled:opacity-40"
                                                        onClick={() => {
                                                            setMenuOpen(false);
                                                            setScreen("name");
                                                        }}
                                                    >
                                                        <IconUser />
                                                        Change name
                                                    </button>
                                                    <button
                                                        className="flex items-center gap-2.5 w-full py-[15px] px-[18px] text-[13px] uppercase tracking-[0.06em] font-medium active:bg-s3 disabled:opacity-40 text-danger"
                                                        onClick={() => {
                                                            setMenuOpen(false);
                                                            setConfirmAll(true);
                                                        }}
                                                        disabled={
                                                            !workers.length
                                                        }
                                                    >
                                                        <IconTrash />
                                                        Delete all
                                                    </button>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            )}
                        </div>

                        {screen === "name" && (
                            <NameView
                                initial={userName}
                                onSave={(n) => {
                                    saveName(n);
                                    setUserName(n);
                                    setScreen("list");
                                }}
                                onSkip={
                                    hasName ? () => setScreen("list") : null
                                }
                            />
                        )}
                        {screen === "list" && (
                            <WorkerList
                                workers={workers}
                                onDelete={setDeleteTarget}
                                cloudOn={CLOUD_ON}
                            />
                        )}
                        {screen === "form" && (
                            <WorkerForm
                                onSubmit={async (id) => {
                                    const next = await getNextPhotoNumber(id);
                                    setPendingId(id);
                                    setNextPhotoNumber(next);
                                    setScreen("camera");
                                }}
                            />
                        )}
                        {screen === "camera" && pendingId && (
                            <CameraView
                                deviceId={pendingId}
                                startNumber={nextPhotoNumber}
                                onComplete={handleComplete}
                                onCancel={() => {
                                    setPendingId(null);
                                    setNextPhotoNumber(1);
                                    setScreen("list");
                                }}
                                showToast={showToast}
                            />
                        )}

                        {screen === "list" && (
                            <div className="fixed bottom-0 left-0 right-0 z-40 pt-3.5 px-[22px] pb-[calc(env(safe-area-inset-bottom,0px)+18px)] bg-bg border-t border-line">
                                <div className="max-w-[520px] mx-auto">
                                    <button
                                        className="w-full flex items-center justify-center gap-[9px] rounded-card font-semibold tracking-[0.06em] uppercase transition-transform duration-100 bg-accent text-[#111] p-[19px] text-[15px] disabled:opacity-35 active:scale-[0.98]"
                                        onClick={() => setScreen("form")}
                                    >
                                        <IconPlus />
                                        New Worker
                                    </button>
                                </div>
                            </div>
                        )}

                        {menuOpen && (
                            <div
                                className="fixed inset-0 z-[50]"
                                onClick={() => setMenuOpen(false)}
                            ></div>
                        )}

                        {confirmAll && (
                            <div
                                className="fixed inset-0 bg-black/60 z-[90] flex items-end justify-center"
                                onClick={() => setConfirmAll(false)}
                            >
                                <div
                                    className="w-full max-w-[520px] bg-s1 border-t border-line2 rounded-t-[20px] px-6 pt-6 pb-[calc(env(safe-area-inset-bottom,0px)+26px)]"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="font-serif text-[26px] mb-1.5">
                                        Delete all workers?
                                    </div>
                                    <div className="text-muted text-[14px] mb-[22px]">
                                        This permanently removes all{" "}
                                        {workers.length} workers and their
                                        photos from this device and from
                                        Supabase. This cannot be undone.
                                    </div>
                                    <button
                                        className="w-full flex items-center justify-center gap-[9px] rounded-card font-semibold tracking-[0.06em] uppercase transition-transform duration-100 bg-danger text-white p-[17px] text-[14px] disabled:opacity-50 active:scale-[0.98]"
                                        onClick={deleteAll}
                                        disabled={deletingAll}
                                    >
                                        <IconTrash />
                                        {deletingAll
                                            ? "Deleting…"
                                            : "Delete everything"}
                                    </button>
                                    <button
                                        className="w-full flex items-center justify-center gap-[9px] rounded-card font-semibold tracking-[0.06em] uppercase transition-transform duration-100 border border-line text-muted py-4 text-[13px] font-medium mt-3"
                                        onClick={() => setConfirmAll(false)}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}
                        {deleteTarget && (
                            <div
                                className="fixed inset-0 bg-black/60 z-[90] flex items-end justify-center"
                                onClick={() => setDeleteTarget(null)}
                            >
                                <div
                                    className="w-full max-w-[520px] bg-s1 border-t border-line2 rounded-t-[20px] px-6 pt-6 pb-[calc(env(safe-area-inset-bottom,0px)+26px)]"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="font-serif text-[26px] mb-1.5">
                                        Delete worker {deleteTarget.deviceId}?
                                    </div>
                                    <div className="text-muted text-[14px] mb-[22px]">
                                        This photo and its record will be
                                        removed from this device.
                                    </div>
                                    <button
                                        className="w-full flex items-center justify-center gap-[9px] rounded-card font-semibold tracking-[0.06em] uppercase transition-transform duration-100 bg-danger text-white p-[17px] text-[14px] disabled:opacity-50 active:scale-[0.98]"
                                        onClick={confirmDelete}
                                    >
                                        <IconTrash />
                                        Delete permanently
                                    </button>
                                    <button
                                        className="w-full flex items-center justify-center gap-[9px] rounded-card font-semibold tracking-[0.06em] uppercase transition-transform duration-100 border border-line text-muted py-4 text-[13px] font-medium mt-3"
                                        onClick={() => setDeleteTarget(null)}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}
                        <Toast msg={toast} />
                    </div>
                );
            }

            ReactDOM.createRoot(document.getElementById("root")).render(
                <App />,
            );
        </script>
    </body>
